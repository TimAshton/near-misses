name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: near_misses
          POSTGRES_PASSWORD: near_misses
          POSTGRES_DB: near_misses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U near_misses"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://near_misses:near_misses@localhost:5432/near_misses_test
      S3_BUCKET: near-misses-test-archive
      S3_ENDPOINT_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Best-effort while frontend/backend are still under active development —
    # allowed to fail without blocking CI until the app is far enough along
    # to run the full stack. Remove continue-on-error once Phase 1 is stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start stack
        run: docker compose up -d --build
      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
      - name: Tear down stack
        if: always()
        run: docker compose down -v

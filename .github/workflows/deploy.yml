name: Deploy

# Runs after the CI workflow finishes on main, and only deploys if CI
# passed — this never races CI, and a broken build on main never ships.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Lets a deploy be re-run on demand (e.g. after fixing the AWS role)
  # without needing a new commit to retrigger CI first.
  workflow_dispatch: {}

# Only one deploy in flight — a second push landing mid-deploy waits
# rather than racing the first one onto the same ECS service / S3 bucket.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write # required to mint the AWS OIDC token
  contents: read

jobs:
  frontend:
    name: Deploy frontend (S3 + CloudFront)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Left empty (same-origin): CloudFront routes /api/* and /ws to the
      # backend ALB on the same domain (see infra/terraform/modules/
      # frontend-hosting), so the built app should never call localhost:8000.
      # Manual builds picked this up from a local, gitignored
      # frontend/.env.production — set it explicitly here too now that CI
      # builds the production bundle instead.
      - run: npm run build
        env:
          VITE_API_URL: ""
          VITE_WS_URL: ""
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync build output to S3
        run: aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  backend:
    name: Deploy backend (ECR + ECS)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$SHA" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$SHA"
          docker push "$REGISTRY/$REPOSITORY:latest"
      - name: Run DB migration
        # Runs `alembic upgrade head` as a one-off Fargate task, reusing the
        # service's own task definition (same image/env/secrets) with the
        # container command overridden, in the same private subnets/security
        # group the running service uses (read from DescribeServices rather
        # than duplicated into a repo variable). Gates the service roll below
        # — a migration that fails must not go on to ship code that expects
        # a schema that isn't there.
        #
        # ECS_SERVICE doubles as the task-definition family name here: both
        # are named "${name}-api" by the Terraform (modules/ecs/main.tf), so
        # there's deliberately no separate variable for it.
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          TASK_FAMILY: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail

          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$TASK_FAMILY" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed (exit code $EXIT_CODE) — see CloudWatch Logs group /ecs/${TASK_FAMILY}, stream prefix api."
            exit 1
          fi
          echo "Migration applied successfully."

      - name: Roll ECS service onto the new image
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment
